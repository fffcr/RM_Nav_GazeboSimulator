# ros_gz_bridge topic mapping
# direction: GZ_TO_ROS | ROS_TO_GZ | BIDIRECTIONAL

- ros_topic_name: "/clock"
  gz_topic_name: "/clock"
  ros_type_name: "rosgraph_msgs/msg/Clock"
  gz_type_name: "ignition.msgs.Clock"
  direction: GZ_TO_ROS

- ros_topic_name: "/joint_states"
  gz_topic_name: "/world/empty/model/my_robot/joint_state"
  ros_type_name: "sensor_msgs/msg/JointState"
  gz_type_name: "ignition.msgs.Model"
  direction: GZ_TO_ROS


# Gazebo 全局场景真值位姿 → 发到 /gz_scene_poses（不直接发 /tf），
# 由 odom_to_tf.py 提取 base_footprint 位姿后重发为 odom->base_footprint。
- ros_topic_name: "/gz_scene_poses"
  gz_topic_name: "/world/empty/pose/info"
  ros_type_name: "tf2_msgs/msg/TFMessage"
  gz_type_name: "ignition.msgs.Pose_V"
  direction: GZ_TO_ROS

- ros_topic_name: "/odom"
  gz_topic_name: "/model/my_robot/odometry"
  ros_type_name: "nav_msgs/msg/Odometry"
  gz_type_name: "ignition.msgs.Odometry"
  direction: GZ_TO_ROS

- ros_topic_name: "/cmd_vel"
  gz_topic_name: "/model/my_robot/cmd_vel"
  ros_type_name: "geometry_msgs/msg/Twist"
  gz_type_name: "ignition.msgs.Twist"
  direction: ROS_TO_GZ

- ros_topic_name: "scan"  # 这里改成你想要的ROS话题名称
  gz_topic_name: "/scan"  # Gazebo中定义的topic
  ros_type_name: "sensor_msgs/msg/LaserScan"
  gz_type_name: "gz.msgs.LaserScan"
  direction: GZ_TO_ROS  # 单向桥接，从Gazebo到ROS
  ros_frame_id: "camera_link"
